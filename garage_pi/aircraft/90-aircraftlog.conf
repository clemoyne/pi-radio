server.modules += ( "mod_proxy" )

alias.url += (
  "/aircraft/data/" => "/run/aircraftlog/",
  "/aircraft/" => "/opt/aircraftlog/www/"
)

url.redirect += (
  "^/aircraft$" => "/aircraft/"
)

$HTTP["url"] =~ "^/aircraft/api/" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8091 ) ) )
}
