# mod_proxy is loaded by 90-aircraftlog.conf; loading it twice is an error
alias.url += (
  "/status/data/" => "/run/pistatus/",
  "/status/" => "/opt/pistatus/www/"
)

url.redirect += (
  "^/status$" => "/status/"
)

$HTTP["url"] =~ "^/status/api/" {
  proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 8093 ) ) )
}
